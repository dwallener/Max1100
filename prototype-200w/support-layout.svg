<text x="45" y="558" font-size="19" font-weight="bold">Cut list and fit instructions</text>
<text x="45" y="590" font-size="16">2 × 282 mm side rails + 2 × 340 mm cross rails; 20 mm square tube, butt joints.</text>
<text x="45" y="620" font-size="16">2 × 390 × 30 × 3 mm mounting straps; shown positions illustrative. Transfer OEM bracket pattern.</text>
<text x="45" y="650" font-size="16">Locate slots and bracket height after dry fit; isolate vibration. Support the duct on a separate cradle.</text>
<text x="45" y="680" font-size="16">337 mm body leaves 16.5 mm below it at the shown centre height. Include terminal-box clearance.</text>
<text x="45" y="714" font-size="13" fill="#52677b">Prototype 200 W/card · 2026-09-18 · See FABRICATION-200W.md for seals, fasteners and test sequence.</text>
